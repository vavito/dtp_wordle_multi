<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordle Eng - MVC</title>

    <link rel="stylesheet" href="assets/css/styles.css" />
    <script type="module" src="js/scripts.js"></script>
  </head>

  <body>
    <main>
      <section id="tela-inicio">
        <h1>WORDLE ENG</h1>

        <p>Escolha o idioma / Choose your language:</p>

        <button class="btn-idioma" type="button" data-idioma="pt">
          Português
        </button>

        <button class="btn-idioma" type="button" data-idioma="en">
          English
        </button>
      </section>

      <section id="tela-jogo">
        <div class="instrucoes" id="msg-instr"></div>

        <div class="stats-container">
          <div>SCORE: <span id="score-val">0</span></div>
          <div>RODADA/ROUND: <span id="round-val">1</span></div>
        </div>

        <div class="mensagem" id="mensagem" role="status"></div>

        <div class="grid" id="board"></div>

        <button id="btn-reiniciar" class="btn-secundario" type="button">
          Reiniciar
        </button>
      </section>
    </main>
  </body>
</html>
